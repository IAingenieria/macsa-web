name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela el que ya va corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # El sitio vive en un subdirectorio del dominio de GitHub Pages.
      NEXT_PUBLIC_BASE_PATH: /macsa-web
      NEXT_PUBLIC_SITE_URL: https://iaingenieria.github.io/macsa-web
      # Dominio provisional -> noindex y robots Disallow. Se pone en 0 el dia
      # que el dominio definitivo sirva el sitio, y NO antes: si se indexa el
      # provisional, el cambio de dominio arrastra mil duplicados.
      NEXT_PUBLIC_NOINDEX: '1'
      # Widget de MacsaIA. El bot filtra por origen: solo acepta
      # iaingenieria.github.io y responde 403 a cualquier otro. Por eso se
      # define AQUI y no en el despliegue de Cloudflare — una burbuja que no
      # contesta es peor que ninguna.
      NEXT_PUBLIC_BOT_WIDGET: https://forja-crm-69958e.shy-block-053a.workers.dev/widget.js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install y no npm ci: el package-lock puede ir por detras cuando el
      # catalogo se actualiza desde otra maquina.
      - run: npm install --no-audit --no-fund

      - name: Generar las paginas producto x ciudad
        run: node scripts/generar_geo.mjs

      - name: Compilar
        run: npm run build

      # Sin .nojekyll, GitHub Pages ignora el directorio _next (empieza con _)
      # y el sitio sale sin estilos ni JavaScript.
      - name: Marcar como sitio sin Jekyll
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
